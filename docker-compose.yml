# docker-compose.yml — Para USUARIOS FINALES (usa la imagen publicada en Docker Hub)
# Para desarrollo local usa: docker compose -f docker-compose.dev.yml up -d
services:
  translarr:
    image: itapiaz/translarr:latest
    container_name: translarr
    environment:
      - TZ=America/Lima
    volumes:
      - ./config:/config
      - /home/media/movies:/movies
      - /home/media/tvshows:/tv
    ports:
      - "4646:80"
    restart: unless-stopped
